<div class="following-container">
  <div class="following-header">
    <h1 class="following-title">SIGUIENDO</h1>
    
    <div class="search-container">
      <div class="search-bar">
        <input type="text" placeholder="Buscar creadores por su nombre" class="search-input" [(ngModel)]="termino"(ngModelChange)="buscar()">
          
      </div>
    </div>
  </div>
  <div id="cargar" *ngIf="cargando">
    <div class="cargar-loader">
      <div class="rueda"></div>
    </div>
    <div class="cargando">Cargando...</div>
            
  </div>
  <div class="no-results" *ngIf="!cargando && sinResultados">
    <div class="empty-state">
      <h3>No se encontraron creadores</h3>
    </div>
  </div>

  <div class="following-layout" *ngIf="!cargando">
  

  <main class="creators-grid" *ngIf="!sinResultados">
    <div class="creator-card" *ngFor="let creador of creadores">
      <div class="creator-avatar">
        <img [src]="creador.fotoperfil" alt="{{ creador.nombre }}" class="creator-img">
      </div>
      <div class="creator-info">
        <h3 class="creator-name">{{ creador.nombre }}</h3>
        <button class="view-creator-btn" (click)="abrirCreador(creador)">
          Ver perfil
        </button>
      </div>
    </div>
  </main>
</div>


</div>
