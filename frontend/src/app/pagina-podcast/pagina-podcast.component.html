
  <div class="podcast-header">
    
    <div class="general">
      <h3 class="podcast-title">Título: {{ podcast.titulo }}</h3>

      <h2 class="podcast-description" >
        Descripción: 
        {{ podcast.descripcion  }}
      </h2>

      <span class="podcast-category">Categoría: {{ podcast.categoria }}</span>
      <br><br>
      <button (click)="accionBotonSuscribirse()" class="sus">{{suscripcion}}</button>
    </div>
    <div class="extra">
      <mat-chip class="premium-chip" *ngIf="podcast.premium">
        Premium
      </mat-chip>
      
    </div>
    
  </div>

  <div class="podcast-content" *ngIf="suscrito || !esPremium">
    <app-list-episodios [episodios]="episodios"></app-list-episodios>
    
  </div>
  <div class="podcast-content" *ngIf="!suscrito && esPremium ">
    <h1>No estas suscrito, no puede accesar a este contenido</h1>
    
  </div>
  <!-- Botón que abre el modal -->


<!-- Modal -->
<div class="modal" *ngIf="mostrarModal">
  <div class="modal-contenido">
    <span class="cerrar" (click)="mostrarModal = false">&times;</span>
    <h2 style="color: white;">Método de pago</h2>

    <input type="text" placeholder="Numero de tarjeta" class="entrada">
    <input type="text" placeholder="Codigo de seguridad" class="entrada">
    <button (click)="suscribirse()" class="view-creator-btn">
        pagar
    </button>

  </div>
</div>
