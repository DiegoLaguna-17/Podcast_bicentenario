<div class="registration-page">
  
  <div class="registration-container">
    <button class="volver" (click)="volverAInicio()">←</button>
    <div class="registration-card">
      <div class="registration-header">
        <h2>Subir Nueva Publicidad</h2>
      </div>
      <form class="upload-form" (ngSubmit)="subirPublicidad()">
          <div class="form-group">
            <label for="ad-name">Nombre de la Publicidad</label>
            <input id="ad-name" type="text" [(ngModel)]="publicidad.nombre" name="nombre" 
                  placeholder="Ej. Promoción de Verano" class="form-input" required>
          </div>

          <div class="form-group">
            <label for="ad-image">Imagen de la Publicidad</label>
            <input id="ad-image" type="file" (change)="onFileSelected($event)" 
                  accept="image/*" class="file-input" required>
            <div class="preview-container" *ngIf="imagePreview">
            <div class="image-preview">
              <img [src]="imagePreview" alt="Vista previa de la publicidad" class="preview-image" width="200" height="200">
            </div>
          </div>
          </div>

          <button type="submit" class="submit-btn" [disabled]="!formValid()">
            Subir Publicidad
          </button>
        </form>
    </div>
  </div>
</div>
