

  <div class="prin">
    <div class="container">
      <div class="header">
        <h1 class="title">Episodios</h1>
        
      </div>
      @if(isLoading===false){
          @if (error) {
            <div id="cargar" style="padding-left: 95vh;">
                <div class="cargar-loader">
                    <div class="rueda"></div>
                </div>
                <div class="cargando">Cargando...</div>          
            </div>
          } @else {
            @if (episodios.length === 0) {
              <div class="empty-state">
                <mat-icon class="empty-icon">Episodios</mat-icon>
                <h3>No se encontraron podcasts</h3>
                <p>Este creador no tiene podcasts publicados aún</p>
              </div>
            } @else {
              <div class="podcast-grid">
                @for (episodio of episodios; track episodio.id) {
                  <app-card-ep-lista [episodio]="episodio"></app-card-ep-lista>
                }
              </div>
            }
          }
        }@else{
          <div id="cargar">
            <div class="cargar-loader">
              <div class="rueda"></div>
            </div>
            <div class="cargando">Cargando...</div>
            
          </div>
        }
    </div>
  </div>
